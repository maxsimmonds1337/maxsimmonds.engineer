<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

{% seo %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    <!--[if lt IE 9]>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5shiv/3.7.3/html5shiv.min.js"></script>
    <![endif]-->
    {% include head-custom.html %}
  </head>
  <body>
    <div class="wrapper">
      <header>
        <div class="profile-section">
          <img src="{{ "/assets/images/profile.jpg" | relative_url }}" alt="Max Simmonds" class="profile-photo">
          <h1><a href="{{ "/" | absolute_url }}">Max Simmonds</a></h1>
          <p class="profile-tagline">{{ site.description | default: site.github.project_tagline }}</p>
          <p class="profile-links">
            <a href="https://linkedin.com/in/max-simmonds">LinkedIn</a> /
            <a href="{{ "/CV/CV.pdf" | relative_url }}">CV</a> /
            <a href="https://www.youtube.com/@LifeofanElectronicEngineer">YouTube</a>
          </p>
        </div>

        <div class="cadence-section">
          <h3 class="cadence-title">Project Cadence</h3>
          <div id="cadence-map"></div>
        </div>
      </header>

      <section>
        {{ content }}
      </section>

      <footer>
        <p><small>Hosted on GitHub Pages &mdash; Theme by <a href="https://github.com/orderedlist">orderedlist</a></small></p>
      </footer>
    </div>
    <script src="{{ "/assets/js/scale.fix.js" | relative_url }}"></script>
    <script src="{{ "/assets/js/cadence.js" | relative_url }}"></script>
  </body>
</html>
